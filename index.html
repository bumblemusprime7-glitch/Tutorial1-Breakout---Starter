<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Game One: Breakout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Breakout</h1>
    <div id="phaser-game"></div>
    <div class="info">
      <div>
        <h4>Goal</h4>
        <p>
          Destroy all the blocks on the screen by bouncing the ball off the
          walls and paddle.
        </p>
      </div>
      <div>
        <h4>Controls</h4>
        <ul>
          <li>A and D keys to move left/right</li>
        </ul>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
